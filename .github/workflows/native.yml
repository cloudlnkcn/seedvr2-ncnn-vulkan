name: Native Linux delivery
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: g++
            web: 'OFF'
          - compiler: clang++
            web: 'OFF'
          - compiler: g++
            web: 'ON'
    env:
      CXX: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, verified 2026-09-08
      - name: Source package and downloader contracts
        run: |
          python3 tools/check_source_package.py --output artifacts/ci/source-package.json
          python3 -m unittest discover -s tests -p test_model_download.py -v
          python3 -m unittest discover -s tests -p test_model_distribution.py -v
          python3 -m unittest discover -s tests -p test_hf_readback.py -v
          python3 -m unittest discover -s tests -p test_knowledge.py -v
          python3 -m unittest discover -s tests -p test_native_install_audit.py -v
          python3 tools/knowledge.py lint --output artifacts/ci/knowledge-lint.json
      - name: Native system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config ripgrep libssl-dev libjpeg-dev libsqlite3-dev libvulkan-dev glslang-dev glslang-tools spirv-tools mesa-vulkan-drivers vulkan-validationlayers libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libomp-dev uuid-dev zlib1g-dev bubblewrap python3-numpy python3-pil
      - name: Video metric contracts without model weights
        run: |
          mkdir -p artifacts/ci
          python3 -m unittest discover -s tests -p test_video_quality.py -v > artifacts/ci/video-quality-contract.log 2>&1
          python3 -m unittest discover -s tests -p test_bounded_video_tools.py -v > artifacts/ci/bounded-video-tools.log 2>&1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        if: matrix.web == 'ON'
        with:
          node-version: '24.18.0'
      - name: Locked dependencies and native build
        env:
          BUILD_WEB: ${{ matrix.web }}
        run: |
          if [ "$BUILD_WEB" = ON ]; then
            python3 tools/build_native.py --jobs 2 --build-dir build/ci --prefix dist/ci
          else
            python3 tools/build_native.py --cli-only --jobs 2 --build-dir build/ci --prefix dist/ci
          fi
      - name: Native execution, installed SDK and negative evidence tests
        run: bash tools/native_ci.sh build/ci dist/ci artifacts/ci
      - name: Native Web host contracts
        if: matrix.web == 'ON'
        run: python3 tools/check_web.py dist/ci/bin/seedvr2-web dist/ci/bin/seedvr2 --output artifacts/ci/web.json
      - name: Retain evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.compiler }}-web-${{ matrix.web }}
          # Explicit log paths only; upload-artifact otherwise omits .cache files.
          include-hidden-files: true
          path: |
            artifacts/ci
            build/ci/Testing/Temporary
            .cache/ncnn-build.log
            .cache/cli11-build.log
            .cache/jsoncpp-build.log
            .cache/drogon-build.log
          if-no-files-found: warn
