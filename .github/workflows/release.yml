# Portable Linux CLI/SDK package for tagged releases.
#
# Models are NOT bundled (10+ GB, downloaded separately via
# tools/download_models.py against the pinned HF revisions). The package
# bundles the ffmpeg/omp shared libraries the binaries link so it runs on
# any glibc-compatible Ubuntu 24.04-era system without extra apt installs.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  APP: seedvr2

jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: "recursive"
      - name: system-dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libssl-dev libjpeg-dev \
            libsqlite3-dev libvulkan-dev glslang-dev glslang-tools spirv-tools \
            mesa-vulkan-drivers libavformat-dev libavcodec-dev libavutil-dev \
            libswscale-dev libomp-dev uuid-dev zlib1g-dev
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: build
        run: |
          python3 tools/build_native.py --jobs "$(nproc)" --prefix dist/rel
      - name: bundle-runtime-libs
        run: |
          # Ship the shared libraries that are not part of a base system so
          # the package is self-contained (glibc still comes from the host).
          LIBDIRS="dist/rel/lib"
          mkdir -p dist/rel/lib/bundled
          for exe in dist/rel/bin/* dist/rel/lib/*.so*; do
            [ -e "$exe" ] || continue
            ldd "$exe" 2>/dev/null | awk '/=> \/usr\/lib/ {print $3}' | while read -r so; do
              case "$(basename "$so")" in
                libav*|libswscale*|libswresample*|libgomp*) cp -n "$so" dist/rel/lib/bundled/ ;;
              esac
            done
          done
      - name: package
        run: |
          PKG="seedvr2-ncnn-vulkan-${GITHUB_REF_NAME#refs/tags/}-ubuntu"
          mkdir -p "dist/${PKG}"
          cp -r dist/rel/bin dist/rel/lib dist/rel/include dist/rel/share "dist/${PKG}/" 2>/dev/null || true
          cp README.md LICENSE NOTICE "dist/${PKG}/" 2>/dev/null || true
          tar -czf "${PKG}.tar.gz" -C dist "${PKG}"
          sha256sum "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256"
      - uses: actions/upload-artifact@v5
        with:
          name: seedvr2-ubuntu
          path: |
            seedvr2-ncnn-vulkan-*-ubuntu.tar.gz
            seedvr2-ncnn-vulkan-*-ubuntu.tar.gz.sha256

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: cache-vulkansdk
        id: cache-vulkansdk
        uses: actions/cache@v5
        with:
          path: "VulkanSDK"
          key: vulkansdk-windows-1.3.290.0
      - name: vulkansdk
        if: steps.cache-vulkansdk.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/1.3.290.0/windows/VulkanSDK-1.3.290.0-Installer.exe?Human=true" -OutFile VulkanSDK-Installer.exe
          7z x -aoa ./VulkanSDK-Installer.exe -oVulkanSDK
      - name: msvc-dev-cmd
        uses: ilammy/msvc-dev-cmd@v1
      - name: deps
        shell: pwsh
        run: |
          $env:VCPKG_DEFAULT_TRIPLET = "x64-windows"
          vcpkg install openssl sqlite3 libjpeg-turbo ffmpeg glslang spirv-tools
          choco install -y pkgconfiglite
      - name: locate-shader-tools
        shell: pwsh
        run: |
          $sdkbin = "$(pwd)/VulkanSDK/Bin"
          if (-not (Test-Path "$sdkbin/glslangValidator.exe")) { throw "glslangValidator.exe not found in VulkanSDK/Bin" }
          if (-not (Test-Path "$sdkbin/spirv-val.exe")) { Write-Host "spirv-val not in SDK; will rely on vcpkg config" }
          "GLSLANG_EXE=$sdkbin/glslangValidator.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
          "SPIRVVAL_EXE=$sdkbin/spirv-val.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$sdkbin" >> $env:GITHUB_PATH

      - name: cli11
        shell: pwsh
        run: |
          $root = (Get-Location).Path
          New-Item -ItemType Directory -Force -Path "$root/.deps/src/cli11" | Out-Null
          Invoke-WebRequest -Uri "https://codeload.github.com/CLIUtils/CLI11/tar.gz/cbd58a3696887b34c70949aef21a71735a0c2ad5" -OutFile cli11.tar.gz
          tar -xzf cli11.tar.gz
          Move-Item "CLI11-cbd58a3696887b34c70949aef21a71735a0c2ad5/*" "$root/.deps/src/cli11/" -Force
          cd "$root/.deps/src/cli11"
          New-Item -ItemType Directory -Force -Path "$root/.deps/install" | Out-Null
          cmake -S . -B build -DCMAKE_INSTALL_PREFIX="$root/.deps/install"
          cmake --install build --config Release
      - name: configure
        shell: pwsh
        run: |
          $env:VULKAN_SDK = "$(pwd)/VulkanSDK"
          $env:PKG_CONFIG_PATH = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/lib/pkgconfig;$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/share/pkgconfig"
          $env:CMAKE_PREFIX_PATH = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/share;$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows"
          $env:CMAKE_POLICY_VERSION_MINIMUM = "3.5"
          python3 tools/prepare_engine.py --jobs $env:NUMBER_OF_PROCESSORS
          cmake -S . -B build -A x64 -DSEEDVR2_BUILD_WEB=OFF "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" "-DCMAKE_PREFIX_PATH=$(Get-Location)/../.deps/install" "-DSEEDVR2_GLSLANG_VALIDATOR=$env:GLSLANG_EXE" "-DSEEDVR2_SPIRV_VAL=$env:SPIRVVAL_EXE"
      - name: build
        shell: pwsh
        run: |
          cmake --build build --config Release -j $env:NUMBER_OF_PROCESSORS
          ./build/Release/seedvr2.exe version
      - name: install
        shell: pwsh
        run: cmake --install build --config Release --prefix dist/rel
      - name: package
        shell: pwsh
        run: |
          $PKG = "seedvr2-ncnn-vulkan-$($env:GITHUB_REF_NAME.Replace('refs/tags/',''))-windows"
          New-Item -ItemType Directory -Force -Path "dist/$PKG" | Out-Null
          Copy-Item -Recurse -Force dist/rel/bin,dist/rel/lib,dist/rel/include,dist/rel/share "dist/$PKG/"
          Copy-Item README.md,LICENSE,NOTICE "dist/$PKG/" -ErrorAction SilentlyContinue
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/*.dll" "dist/$PKG/bin/"
          tar -czf "$PKG.tar.gz" -C dist $PKG
          sha256sum "$PKG.tar.gz" > "$PKG.tar.gz.sha256"
      - uses: actions/upload-artifact@v5
        with:
          name: seedvr2-windows
          path: |
            seedvr2-ncnn-vulkan-*-windows.tar.gz
            seedvr2-ncnn-vulkan-*-windows.tar.gz.sha256

  release:
    needs: [ubuntu, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: download-artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true
      - name: attach-to-release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.sha256
          generate_release_notes: true
