name: Ubuntu release and clean-machine model test
on:
  workflow_dispatch:
    inputs:
      tag:
        description: New prerelease tag (never overwrite published assets)
        required: true
        default: native-ubuntu24.04-fp32b-v1
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.18.0'
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config ripgrep libssl-dev libjpeg-dev libsqlite3-dev libvulkan-dev glslang-dev glslang-tools spirv-tools mesa-vulkan-drivers vulkan-validationlayers libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libomp-dev uuid-dev zlib1g-dev bubblewrap python3-numpy python3-pil
      - name: Build and validate installed CLI, Web and SDK
        run: |
          python3 tools/build_native.py --jobs 2 --build-dir build/release-ci --prefix dist/seedvr2
          bash tools/native_ci.sh build/release-ci dist/seedvr2 artifacts/release-build
          python3 tools/check_web.py dist/seedvr2/bin/seedvr2-web dist/seedvr2/bin/seedvr2 --output artifacts/release-build/web.json
      - name: Collect corresponding dependency source archives
        run: |
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          mkdir -p dist/dependency-sources
          cd dist/dependency-sources
          for package in libavcodec-dev libx264-dev glslang-dev spirv-tools; do
            if ! dpkg-query -W "$package" >/dev/null 2>&1; then sudo apt-get install -y "$package"; fi
            source=$(dpkg-query -W -f='${source:Package}=${source:Version}' "$package")
            apt-get source --download-only "$source"
          done
      - name: Assemble documented Ubuntu package and source material
        run: python3 tools/package_ubuntu_release.py --install dist/seedvr2 --output dist/release
      - name: Upload candidate program and source assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --title 'SeedVR2 native Ubuntu 24.04 x86_64 FP32-B' --notes-file dist/release/RELEASE.md
          gh release upload "$RELEASE_TAG" dist/release/*
      - name: Retain build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ubuntu-release-build
          include-hidden-files: true
          path: |
            artifacts/release-build
            .cache/*-build.log
            build/release-ci/Testing/Temporary
  clean-machine:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Download candidate binaries from release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/delivery"
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/delivery" --pattern 'seedvr2-ubuntu24.04-x86_64.tar.gz' --pattern SHA256SUMS
          cd "$RUNNER_TEMP/delivery"
          sha256sum --check --ignore-missing SHA256SUMS
          tar -xzf seedvr2-ubuntu24.04-x86_64.tar.gz
          sudo bash seedvr2/install-runtime-ubuntu24.04.sh
      - name: Download reviewed image model from public release
        run: |
          python3 tools/model_distribution.py install --catalog docs/distribution/catalog.v1.json --kind image --base-url https://github.com/mingshi2333/seedvr2-ncnn-vulkan/releases/download/models-fp32b-v1 --layout flat --output "$RUNNER_TEMP/模型 image" --report artifacts/clean-machine/install.json
          "$RUNNER_TEMP/delivery/seedvr2/bin/seedvr2" models verify --model "$RUNNER_TEMP/模型 image" > artifacts/clean-machine/native-verify.json
      - name: Real CPU first execution and isolated offline replay
        run: |
          sudo apt-get install -y bubblewrap python3-numpy python3-pil
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          python3 tools/check_release_first_run.py --binary "$RUNNER_TEMP/delivery/seedvr2/bin/seedvr2" --model "$RUNNER_TEMP/模型 image" --output "$RUNNER_TEMP/首次使用 evidence" --report artifacts/clean-machine/run.json
      - name: Publish after independent-machine functional checks
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" artifacts/clean-machine/*.json
          gh release edit "$RELEASE_TAG" --draft=false --prerelease
      - name: Retain machine evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ubuntu-clean-machine
          path: |
            artifacts/clean-machine
            ${{ runner.temp }}/首次使用 evidence
