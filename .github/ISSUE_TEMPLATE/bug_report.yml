name: Reproducible bug
description: Report a build, operator, model execution or local application problem.
body:
  - type: dropdown
    id: scope
    attributes:
      label: Failing stage
      options:
        - Build or install
        - Download or export
        - Small operator or real component
        - Complete image or short-video execution
        - Local Web or SDK
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Commit and environment
      description: Include OS, compiler, CPU/GPU, driver, backend, and output of seedvr2 version.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Exact command or UI steps, expected result, and actual result. Use a shareable small input.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs and reports
      description: Attach the relevant failure log or run.json; remove personal paths or secrets before sharing. Do not upload model weights.
